name: Release

on:
  push:
    branches:
      - main
    paths:
      - public/manifest.json

permissions:
  contents: write

jobs:
  release:
    name: Publish extension release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release source
        run: npm run validate

      - name: Package extension
        run: npm run package

      - name: Read extension version
        id: version
        shell: bash
        run: echo "version=$(node -p \"JSON.parse(require('fs').readFileSync('public/manifest.json', 'utf8')).version\")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" visual-style-editor-extension.zip --clobber
          else
            gh release create "$TAG" visual-style-editor-extension.zip \
              --target "$GITHUB_SHA" \
              --title "Visual Style Editor $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
